<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Math Forest Config</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body class="bg-[#F7F7FD] font-['Outfit'] text-[#0F2C67] p-8">
    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-4xl font-black">MATH FOREST : CORE</h1>
            <a href="/admin"
                class="bg-white/50 border border-[#0F2C67]/10 px-6 py-2 rounded-xl font-bold hover:bg-[#0F2C67] hover:text-white transition">Back</a>
        </div>

        <form action="/admin/mixed-reality" method="POST"
            class="bg-white p-10 rounded-[3rem] shadow-2xl space-y-8 border border-[#0F2C67]/5">
            <div>
                <label class="block text-xs font-black uppercase tracking-widest opacity-40 mb-2">Spawn Interval
                    (Frames)</label>
                <input type="number" name="spawnRate" value="{{ config.spawnRate }}"
                    class="w-full p-4 rounded-2xl bg-[#0F2C67]/5 font-black text-2xl outline-none focus:ring-4 ring-[#0F2C67]/10 transition">
            </div>
            <div class="grid grid-cols-2 gap-8">
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest opacity-40 mb-2">Start
                        Speed</label>
                    <input type="number" step="0.0001" name="currentSpeed" value="{{ config.currentSpeed }}"
                        class="w-full p-4 rounded-2xl bg-[#0F2C67]/5 font-black text-xl outline-none">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest opacity-40 mb-2">Speed Incr</label>
                    <input type="number" step="0.0001" name="speedIncrement" value="{{ config.speedIncrement }}"
                        class="w-full p-4 rounded-2xl bg-[#0F2C67]/5 font-black text-xl outline-none">
                </div>
            </div>
            <div>
                <label class="block text-xs font-black uppercase tracking-widest opacity-40 mb-2">Math Difficulty
                    Range</label>
                <input type="number" name="mathRange" value="{{ config.mathRange }}"
                    class="w-full p-4 rounded-2xl bg-[#0F2C67]/5 font-black text-2xl outline-none">
            </div>
            <button type="submit"
                class="w-full bg-[#7D1424] text-white py-5 rounded-[2rem] font-black text-xl hover:shadow-2xl transition-all active:scale-95">UPDATE
                FOREST PARAMETERS 🌲</button>
        </form>
    </div>
</body>

</html>
