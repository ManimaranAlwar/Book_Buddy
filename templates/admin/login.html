<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Book Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #F7F7FD;
        }

        .glass {
            background: rgba(15, 44, 103, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(15, 44, 103, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md glass p-8 rounded-3xl shadow-xl">
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-[#7D1424] rounded-full flex items-center justify-center text-4xl mx-auto mb-4">🔐
            </div>
            <h1 class="text-3xl font-black text-[#0F2C67]">ADMIN PORTAL</h1>
            <p class="text-[#0F2C67]/60">Enter password to manage games</p>
        </div>

        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6 rounded" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-6">
                <label class="block text-[#0F2C67] text-sm font-bold mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#7D1424] transition">
            </div>
            <button type="submit"
                class="w-full bg-[#0F2C67] hover:bg-[#7D1424] text-white font-bold py-4 rounded-xl shadow-lg transition duration-300">
                UNLOCK DASHBOARD
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="/" class="text-[#0F2C67]/40 hover:text-[#0F2C67] text-sm font-bold transition">← Back to Games</a>
        </div>
    </div>
</body>

</html>
