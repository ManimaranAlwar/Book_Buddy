<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Daily Box Pick</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            red: '#7D1424',
                            blue: '#0F2C67',
                            white: '#F7F7FD',
                        }
                    }
                }
            }
        }
    </script>
    <script src="/static/js/games-sdk.js"></script>
    <link rel="stylesheet" href="/static/css/global.css">
    <link rel="stylesheet" href="/static/box_pick/style.css">
</head>

<body class="p-6">
    <a href="/"
        class="fixed top-4 left-4 bg-theme-blue/20 hover:bg-theme-blue/40 text-theme-blue px-4 py-2 rounded-full font-bold backdrop-blur">←
        Hub</a>

    <div class="max-w-4xl mx-auto text-center mt-12">
        <h1 class="text-5xl font-black text-theme-blue drop-shadow-lg mb-4">📦 Box Pick Challenge</h1>

        <div class="bg-theme-blue/5 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-theme-blue/20">
            <!-- Streak Header -->
            <div
                class="flex justify-between items-center mb-8 bg-theme-white p-4 rounded-xl border border-theme-blue/10">
                <div class="text-theme-blue">
                    <span class="text-sm opacity-70">CURRENT STREAK</span>
                    <div class="text-3xl font-bold">🔥 <span id="current-streak">0</span></div>
                </div>
                <div class="text-theme-blue text-right">
                    <span class="text-sm opacity-70">DAILY PUZZLE</span>
                    <div class="text-2xl font-bold text-theme-red">Active</div>
                </div>
            </div>

            <!-- Riddle -->
            <div class="bg-theme-white rounded-2xl p-6 mb-8 shadow-lg transform -rotate-1 border border-theme-blue/10">
                <div class="text-6xl mb-2" id="riddle-emoji">❓</div>
                <h2 class="text-theme-blue/60 uppercase font-bold text-sm tracking-widest">Today's Riddle</h2>
                <p id="riddle-text" class="text-2xl font-bold text-theme-blue mt-2">Loading Puzzle...</p>
            </div>

            <!-- Game Area -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Word Box -->
                <div class="bg-theme-white rounded-2xl p-6 min-h-[300px] border-4 border-dashed border-theme-blue/20">
                    <h3 class="text-theme-blue font-bold mb-4 uppercase text-xs">Keep the Correct Words</h3>
                    <div id="words-container" class="flex flex-wrap gap-3 justify-center">
                        <!-- Words injected here -->
                    </div>
                </div>

                <!-- Trash Bin -->
                <div class="flex flex-col items-center justify-center">
                    <div id="trash-zone"
                        class="trash-can cursor-pointer p-8 rounded-full bg-theme-red/10 hover:bg-theme-red/20 border-4 border-theme-red/50 w-48 h-48 flex flex-col items-center justify-center shadow-inner">
                        <span class="text-6xl text-theme-red">🗑️</span>
                        <span class="font-bold text-theme-red mt-2">DROP WRONG WORDS HERE</span>
                    </div>

                    <div id="removed-section" class="mt-4 hidden w-full">
                        <h4 class="text-theme-blue font-bold mb-2 text-sm">Trashed Items:</h4>
                        <div id="removed-words" class="flex flex-wrap gap-2 justify-center"></div>
                    </div>
                </div>
            </div>

            <button id="submit-btn"
                class="mt-12 bg-theme-red hover:brightness-110 text-theme-white text-2xl font-black py-4 px-12 rounded-full shadow-xl transform hover:scale-105 transition">✨
                CHECK BOX ✨</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="fixed inset-0 bg-theme-white/90 flex items-center justify-center hidden z-50">
        <div
            class="bg-theme-white rounded-3xl p-12 text-center max-w-md mx-4 animate-bounce-in border-4 border-theme-blue shadow-2xl">
            <div class="text-8xl mb-4">🎉</div>
            <h2 class="text-4xl font-black text-theme-blue mb-2">PERFECT!</h2>
            <p class="text-theme-blue/70 mb-8">You solved the daily puzzle.</p>
            <a href="/" class="bg-theme-red text-theme-white px-8 py-3 rounded-full font-bold hover:brightness-110">Back
                to
                Hub</a>
        </div>
    </div>

    <script src="/static/box_pick/script.js"></script>
</body>

</html>
