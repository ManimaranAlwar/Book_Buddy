<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER ALCHEMY | BOOK-BUDDY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        theme: {
                            red: '#7D1424',
                            blue: '#0F2C67',
                            white: '#F7F7FD',
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/global.css">
    <script src="/static/js/games-sdk.js"></script>
    <style>
        body {
            background: #F7F7FD;
            font-family: 'Outfit', sans-serif;
            color: #0F2C67;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(15, 44, 103, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(15, 44, 103, 0.1);
        }

        .cauldron-glow {
            filter: drop-shadow(0 0 20px rgba(15, 44, 103, 0.15));
        }

        .slot-active {
            box-shadow: 0 0 0 2px #0F2C67;
            background: rgba(15, 44, 103, 0.05);
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes bubble {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }

        .bubble {
            position: absolute;
            background: rgba(15, 44, 103, 0.1);
            border-radius: 50%;
            pointer-events: none;
            animation: bubble 4s infinite ease-in;
        }
    </style>
</head>

<body class="min-h-screen relative py-12 px-6">
    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] bg-theme-blue/5 rounded-full blur-[120px] -z-10"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-theme-red/5 rounded-full blur-[100px] -z-10"></div>

    <nav class="fixed top-0 left-0 right-0 p-8 flex justify-between items-center z-50">
        <a href="/"
            class="glass px-6 py-3 rounded-2xl flex items-center gap-2 font-black hover:bg-theme-blue hover:text-white transition-all group">
            <span class="group-hover:-translate-x-1 transition-transform">←</span> EXIT LAB
        </a>
        <div class="glass px-8 py-3 rounded-2xl flex items-center gap-4">
            <div class="text-right">
                <div class="text-[10px] font-black uppercase tracking-widest text-theme-blue/40">MASTER ALCHEMIST</div>
                <div class="font-black text-theme-blue">{{ username }}</div>
            </div>
            <a href="/young-scientist/logout" class="text-theme-red hover:opacity-70 transition-opacity">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
            </a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto pt-20">
        <div class="grid lg:grid-cols-2 gap-8 items-center">

            <!-- Mixing Section -->
            <div class="relative">
                <div class="glass rounded-[3rem] p-12 text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-2 bg-theme-blue/5"></div>

                    <h1 class="text-4xl font-black text-theme-blue mb-12 tracking-tighter">THE CAULDRON</h1>

                    <div class="relative w-64 h-64 mx-auto mb-12 flex items-center justify-center cauldron-container">
                        <!-- Bubbles -->
                        <div class="bubble" style="left: 20%; width: 20px; height: 20px; animation-delay: 0s;"></div>
                        <div class="bubble" style="left: 50%; width: 15px; height: 15px; animation-delay: 1s;"></div>
                        <div class="bubble" style="left: 80%; width: 25px; height: 25px; animation-delay: 2s;"></div>

                        <div class="flex gap-6 items-center justify-center z-10">
                            <div id="slot1"
                                class="w-24 h-24 glass rounded-3xl flex items-center justify-center text-4xl shadow-xl transition-all cursor-pointer hover:scale-105"
                                onclick="removeFromSlot(1)">?</div>
                            <div class="text-3xl font-black text-theme-blue/20 animate-pulse">✨</div>
                            <div id="slot2"
                                class="w-24 h-24 glass rounded-3xl flex items-center justify-center text-4xl shadow-xl transition-all cursor-pointer hover:scale-105"
                                onclick="removeFromSlot(2)">?</div>
                        </div>
                    </div>

                    <button
                        class="w-full bg-theme-blue text-white py-6 rounded-[2rem] font-black text-xl hover:shadow-2xl hover:shadow-theme-blue/20 transition-all active:scale-95 group"
                        onclick="clearSlots()">
                        PURIFY CAULDRON <span
                            class="inline-block group-hover:rotate-180 transition-transform ml-2">🧹</span>
                    </button>
                </div>
            </div>

            <!-- Inventory Section -->
            <div class="glass rounded-[3rem] p-10 h-full flex flex-col">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-xl font-black text-theme-blue tracking-tight">ELEMENT POUCH</h3>
                    <div
                        class="bg-theme-blue/5 px-4 py-1 rounded-full text-[10px] font-black uppercase text-theme-blue/40 tracking-widest">
                        <span id="collected-count">0</span> DISCOVERED
                    </div>
                </div>

                <div id="inventory"
                    class="grid grid-cols-4 sm:grid-cols-5 gap-3 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                    <!-- Elements will be injected here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Discovery Overlay -->
    <div id="discovery-box"
        class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6 bg-theme-blue/20 backdrop-blur-xl">
        <div
            class="glass bg-white/80 rounded-[4rem] p-12 text-center max-w-sm w-full animate-bounce-in shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-theme-blue"></div>
            <div class="text-4xl mb-4">✨🧪✨</div>
            <h2 class="text-4xl font-black text-theme-blue mb-2 tracking-tighter">NEW DISCOVERY!</h2>
            <div id="new-emoji" class="text-8xl mb-6 animate-float"></div>
            <p id="explanation-text" class="text-theme-blue/60 font-medium mb-8 leading-relaxed"></p>
            <button
                class="w-full bg-theme-blue text-white py-5 rounded-3xl font-black text-lg hover:shadow-xl hover:shadow-theme-blue/20 transition-all active:scale-95"
                onclick="closeDiscovery()">
                ADD TO POUCH
            </button>
        </div>
    </div>

    <input type="hidden" id="current-user" value="{{ username }}">
    <script src="/static/young_scientist/script.js"></script>
    <script>
        // Custom function to handle slot removal that's not in the original script
        function removeFromSlot(slotId) {
            const slot = document.getElementById('slot' + slotId);
            slot.innerText = '?';
            slot.classList.remove('slot-active');
        }
    </script>
</body>

</html>
